[tool.poetry]
name = "mri_rotation"
version = "0.1.0"
description = "Neural network to correct rotation of MRI images."
authors = ["Alson van der Meulen <git@alm.nufan.net>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,!=3.14.1,<4.0"
nibabel = "^5.5"
torch = "^2.15"
matplotlib = "^3.11"
scipy = "^1.18"
numpy = "^2.5"
scikit-learn = "^1.9"
tensorboard = "^2.21"
torchvision = "^0.29"
scikit-image = "^0.26"

[tool.poetry.group.dev.dependencies]
tqdm = "^4.67"
pytest = "^9.2"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
